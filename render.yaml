# Render Blueprint — deploys projects/aircraft-maintenance-api as a live demo.
#
# This repository holds several unrelated portfolio projects, but Render only
# reads a blueprint from the repository root, which is why this file sits here
# rather than beside the API it deploys.
#
# To deploy: Render dashboard -> New -> Blueprint -> select this repo.
# Everything below is provisioned automatically except DEMO_PASSWORD, which is
# marked sync:false so it gets typed into the dashboard once and never lands in
# git.
#
# Free-tier caveat worth knowing before sharing the link: the web service spins
# down after inactivity, so the first request after an idle period takes
# roughly 50 seconds to wake up. The managed Postgres free instance also has a
# fixed lifetime and needs recreating when it expires.

databases:
  - name: maintenance-log-db
    databaseName: maintenance_log
    user: maintenance
    plan: free

services:
  - type: web
    name: aircraft-maintenance-api
    runtime: docker
    plan: free
    dockerContext: ./projects
    dockerfilePath: ./projects/aircraft-maintenance-api/Dockerfile
    healthCheckPath: /health
    envVars:
      # Render hands this out as postgres://... ; main.py normalises it to the
      # +asyncpg dialect and requires SSL for any non-local host.
      - key: DATABASE_URL
        fromDatabase:
          name: maintenance-log-db
          property: connectionString

      # Render's managed Postgres starts empty and has no init-script hook the
      # way the local docker-compose Postgres does, so the API applies
      # schema.sql itself on boot. schema.sql is idempotent, so this stays safe
      # on every redeploy rather than only the first.
      - key: RUN_DB_BOOTSTRAP
        value: "true"

      # Generated by Render and never seen in the repo. Tokens issued before a
      # rotation stop validating, which is the intended behaviour.
      - key: JWT_SECRET_KEY
        generateValue: true

      # Read-only GET routes need no token; these only guard the write routes.
      # The username is public on purpose so a recruiter can try the API.
      - key: DEMO_USERNAME
        value: recruiter
      - key: DEMO_PASSWORD
        sync: false

      - key: RATE_LIMIT_MAX_REQUESTS
        value: "60"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
